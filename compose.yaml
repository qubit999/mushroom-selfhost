# Mushroom on your own hardware.
#
#   cp .env.example .env    # fill in PUBLIC_BASE
#   docker compose up -d
#
# Four services from one image, in place of the six systemd units in systemd/ (kept for anyone
# who'd rather not run Docker). Same paths, so the same scripts run unchanged.

name: mushroom

# One image, built once. Every service is the same tree with a different command.
x-mushroom: &mushroom
  build:
    context: .
    args:
      # Set BASE in .env to build from your own mirror, as an air-gapped install needs.
      BASE: ${BASE:-node:22-slim}
  image: mushroom-selfhost
  restart: unless-stopped

services:
  # R2's stand-in. Serves only a unix socket and talks to nobody, so it's on no network at all.
  #
  # It turns strings off a socket into paths, so it sees the blobs and its own socket and
  # nothing else: not the databases, not secrets.env, not the admin sockets.
  blobd:
    <<: *mushroom
    command: node blobd.mjs
    network_mode: none
    environment:
      BLOB_ROOT: /var/lib/mushroom/blobs
      BLOB_SOCKET: /run/blobd/blobd.sock
    volumes:
      - blobs:/var/lib/mushroom/blobs
      - blobsock:/run/blobd

  workerd:
    <<: *mushroom
    # The entrypoint derives config.capnp from .env plus the generated secrets, then execs this.
    entrypoint: ./docker-entrypoint.sh
    command: node_modules/.bin/workerd serve config.capnp
    env_file: .env
    volumes:
      - state:/var/lib/mushroom
      - run:/run/mushroom
      - blobsock:/run/blobd
    # Published on the host's loopback, since TLS is terminated in front (see README). Both are
    # plain http and must never be reachable from outside this machine.
    #
    # Note the crossing when you put a proxy in front: 8081 is files and gets the bare :443
    # address, because PUBLIC_BASE is in every share link. 8080 is friends and takes :8443.
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    depends_on:
      - blobd

  # workerd has no cron (`triggers.crons` is a Cloudflare platform feature), so a loop runs the
  # sweep, as the systemd timer does outside Docker.
  #
  # A sweep that silently stops is the failure worth catching: watch `docker compose ps` (the
  # container gone or restarting) and `docker compose logs cron` (cron.sh prints to stderr and
  # exits non-zero). `|| true` keeps the loop alive through a transient failure without hiding it.
  #
  # Sleep first, so a boot doesn't sweep before workerd opens its sockets.
  cron:
    <<: *mushroom
    command: sh -c 'while :; do sleep 3600; ./cron.sh || true; done'
    environment:
      ADMIN_SOCK: /run/mushroom/admin.sock
      FILES_ADMIN_SOCK: /run/mushroom/files-admin.sock
      BLOB_ROOT: /var/lib/mushroom/blobs
      # Must match TTL_SECONDS in files-worker/worker.js. The backstop deletes blobs older than
      # twice this, so a wrong value deletes bytes under rows the database still calls ready.
      TTL_HOURS: "24"
    network_mode: none
    # The admin sockets for the sweep, and the blobs for the backstop. No databases.
    volumes:
      - blobs:/var/lib/mushroom/blobs
      - run:/run/mushroom
    depends_on:
      - workerd

  backup:
    <<: *mushroom
    command: sh -c 'while :; do sleep 86400; ./backup.sh || true; done'
    environment:
      STATE_ROOT: /var/lib/mushroom
      DEST: /var/backups/mushroom
      KEEP: "3"
    network_mode: none
    volumes:
      - state:/var/lib/mushroom
      - backups:/var/backups/mushroom

volumes:
  # Both durable-object trees and secrets.env: the volume that matters.
  state:
  # Shared files. Each expires within a day, so nothing here is worth backing up.
  blobs:
  # The two admin sockets, shared by workerd and cron. Disposable.
  run:
  # blobd's socket, shared by blobd and workerd only. Disposable.
  blobsock:
  backups:
